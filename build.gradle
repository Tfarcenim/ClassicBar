plugins {
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.36'
}

version = "${mod_version}"
group = "${mod_group_id}"

base {
    archivesName = "${modid}"
}

jar {
    archiveFileName = "${modid}-${minecraft_version}-${mod_version}-neoforge.jar"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

minecraft {
    // MC 26.1 made FoodData.exhaustionLevel private (the public exhaustion accessors were
    // removed). Expose it via access transformer so ClassicBar can read/write exhaustion.
    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.modid
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.modid
        argument '--nogui'
    }
}

repositories {
    maven {
        url = "https://maven.maxanier.de/releases"
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // Mod-compat integrations are temporarily disabled for the MC 26.1.2 upgrade.
    // These CurseForge/Vampirism artifacts are still pinned to MC 1.21.1 and reference
    // classes that were removed in 26.1, so they cannot be on the 26.1 compile classpath.
    // The corresponding overlays/helpers are stubbed out (shouldRender() == false) and
    // each dependency should be re-enabled as the upstream mod ships a 26.1 build.
    // compileOnly "curse.maven:parcool-482378:${parcool}"
    // compileOnly "curse.maven:glitchcore-955399:${glitchcore}"
    // compileOnly "curse.maven:tough-as-nails-246391:${tough_as_nails}"
    // compileOnly "de.teamlapen.vampirism:Vampirism:1.21-1.10.7:api"
    // compileOnly "curse.maven:vampirism-become-a-vampire-233029:${vampirism}"
    // compileOnly "curse.maven:thirst-was-taken-679270:${thirst_was_taken}"
    // compileOnly "curse.maven:homeostatic-634466:${homeostatic}"
    // compileOnly "curse.maven:overloaded-armor-bar-314002:${overloaded_armor_bar}"
    // compileOnly "curse.maven:irons-spells-n-spellbooks-855414:${irons_spells}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            modid                  : modid,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
